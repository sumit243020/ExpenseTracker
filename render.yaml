# Render Blueprint — deploy both UI + API with Docker
# https://render.com/docs/blueprint-spec
#
# After first deploy, copy the API public URL into the web service API_URL
# if auto-wiring is empty, or rely on fromService host below.

services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: -Xms64m -Xmx384m

  - type: web
    name: expense-tracker-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./ionic-app/Dockerfile
    dockerContext: ./ionic-app
    healthCheckPath: /
    envVars:
      - key: API_URL
        fromService:
          name: expense-tracker-api
          type: web
          property: host
