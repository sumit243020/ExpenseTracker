server.port=${PORT:8080}
spring.application.name=expense-tracker-api

# File DB under /data (Render disk optional; ephemeral OK on free tier)
spring.datasource.url=jdbc:h2:file:./data/expenses;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable H2 console on public internet
spring.h2.console.enabled=false

# Override in Render: APP_JWT_SECRET
app.jwt.secret=${APP_JWT_SECRET:ExpenseTrackerSecretKeyChangeMeInProduction_2026_SecureLongValue}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:2592000000}

server.error.include-message=never
server.compression.enabled=true
